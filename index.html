<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tank Game - Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #111; 
            font-family: Arial, sans-serif;
        }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
        }
        #info h1 { font-size: 18px; margin-bottom: 10px; color: #4a87b8; }
        #info p { margin: 5px 0; }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            background: rgba(0,0,0,0.8);
            padding: 30px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>3D Tank Game - Preview</h1>
        <p><strong>Grid:</strong> 50x50 cells, 4m each</p>
        <p><strong>Map Size:</strong> 200m x 200m</p>
        <p><strong>Tanks:</strong> Player 1 (Blue), Player 2 (Brown)</p>
        <p><strong>Target:</strong> Yellow flag at center</p>
        <p><strong>Controls:</strong> Mouse drag to rotate, scroll to zoom</p>
        <p style="margin-top: 10px; font-size: 12px; color: #888;">
            Design preview - No gameplay controls yet
        </p>
    </div>
    <div id="loading">Loading 3D Scene...</div>

    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Sky blue
        scene.fog = new THREE.Fog(0x87CEEB, 100, 500);

        // Camera
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(100, 120, 100);
        camera.lookAt(50, 0, 50);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Orbit Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = false;
        controls.minDistance = 40;
        controls.maxDistance = 300;
        controls.maxPolarAngle = Math.PI / 2.1;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(100, 200, 50);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.left = -200;
        directionalLight.shadow.camera.right = 200;
        directionalLight.shadow.camera.top = 200;
        directionalLight.shadow.camera.bottom = -200;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 500;
        scene.add(directionalLight);

        // Grid helper - 50x50 grid at 4m each
        const gridSize = 50;
        const cellSize = 4;
        const gridHelper = new THREE.GridHelper(gridSize * cellSize, gridSize, 0x555555, 0x333333);
        gridHelper.position.y = -0.1;
        scene.add(gridHelper);

        // Axes helper
        const axesHelper = new THREE.AxesHelper(20);
        scene.add(axesHelper);

        // Ground plane
        const groundGeometry = new THREE.PlaneGeometry(gridSize * cellSize, gridSize * cellSize);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x3a5f0b,
            roughness: 0.8,
            metalness: 0.2
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // ============================================
        // TANK MODELS (3D)
        // ============================================
        
        function createTank(color, position, rotationY = 0) {
            const group = new THREE.Group();
            group.position.set(position.x, 0, position.z);
            group.rotation.y = rotationY;
            
            // Tank body (main hull)
            const bodyGeometry = new THREE.BoxGeometry(3.8, 1.2, 2.2);
            const bodyMaterial = new THREE.MeshStandardMaterial({
                color: color.body,
                roughness: 0.4,
                metalness: 0.3
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0.6;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // Tank turret
            const turretGeometry = new THREE.CylinderGeometry(1.2, 1.4, 0.8, 32);
            const turretMaterial = new THREE.MeshStandardMaterial({
                color: color.turret,
                roughness: 0.3,
                metalness: 0.4
            });
            const turret = new THREE.Mesh(turretGeometry, turretMaterial);
            turret.position.set(0, 1.4, 0.2);
            turret.rotation.x = Math.PI / 2;
            turret.castShadow = true;
            group.add(turret);

            // Cannon
            const cannonGeometry = new THREE.CylinderGeometry(0.15, 0.2, 3.5, 16);
            const cannonMaterial = new THREE.MeshStandardMaterial({
                color: color.cannon,
                roughness: 0.2,
                metalness: 0.8
            });
            const cannon = new THREE.Mesh(cannonGeometry, cannonMaterial);
            cannon.position.set(0, 1.8, 0.8);
            cannon.rotation.x = Math.PI / 6;
            cannon.castShadow = true;
            group.add(cannon);

            // Tracks (left)
            const trackGeometry = new THREE.BoxGeometry(0.3, 0.2, 2.4);
            const trackMaterial = new THREE.MeshStandardMaterial({
                color: color.tracks,
                roughness: 0.8,
                metalness: 0.1
            });
            const leftTrack = new THREE.Mesh(trackGeometry, trackMaterial);
            leftTrack.position.set(-1.7, 0.3, 0);
            leftTrack.castShadow = true;
            group.add(leftTrack);

            // Tracks (right)
            const rightTrack = new THREE.Mesh(trackGeometry, trackMaterial);
            rightTrack.position.set(1.7, 0.3, 0);
            rightTrack.castShadow = true;
            group.add(rightTrack);

            // Small details on body
            const detailGeometry = new THREE.BoxGeometry(0.4, 0.3, 0.4);
            const detailMaterial = new THREE.MeshStandardMaterial({
                color: color.details,
                roughness: 0.5,
                metalness: 0.3
            });
            
            const detail1 = new THREE.Mesh(detailGeometry, detailMaterial);
            detail1.position.set(-1.2, 1.1, 0.8);
            group.add(detail1);

            const detail2 = new THREE.Mesh(detailGeometry, detailMaterial);
            detail2.position.set(1.2, 1.1, 0.8);
            group.add(detail2);

            return group;
        }

        // Player 1 (Blue) tank
        const player1Color = {
            body: 0x5a6d5a,
            turret: 0x4a7ba7,
            cannon: 0x3a3a3a,
            tracks: 0x4a4a4a,
            details: 0x3a4a3a
        };
        const tank1 = createTank(player1Color, { x: 10, z: 10 }, 0);
        scene.add(tank1);

        // Player 2 (Brown) tank
        const player2Color = {
            body: 0x874a2e,
            turret: 0xa76b4a,
            cannon: 0x3a3a3a,
            tracks: 0x6b4a2e,
            details: 0x6b3a2e
        };
        const tank2 = createTank(player2Color, { x: 90, z: 90 }, Math.PI);
        scene.add(tank2);

        // ============================================
        // TARGET (Flag)
        // ============================================
        
        function createFlag(position) {
            const group = new THREE.Group();
            group.position.set(position.x, 0, position.z);

            // Flag pole
            const poleGeometry = new THREE.CylinderGeometry(0.1, 0.1, 4, 16);
            const poleMaterial = new THREE.MeshStandardMaterial({
                color: 0x8b6b4a,
                roughness: 0.5,
                metalness: 0.2
            });
            const pole = new THREE.Mesh(poleGeometry, poleMaterial);
            pole.position.y = 2;
            pole.castShadow = true;
            group.add(pole);

            // Flag (waving animation will be added later)
            const flagGeometry = new THREE.PlaneGeometry(1.5, 1.2);
            const flagMaterial = new THREE.MeshStandardMaterial({
                color: 0xf3d16b,
                side: THREE.DoubleSide,
                roughness: 0.7,
                metalness: 0
            });
            const flag = new THREE.Mesh(flagGeometry, flagMaterial);
            flag.position.set(0, 3.2, 0);
            flag.rotation.x = Math.PI / 4;
            flag.castShadow = false;
            group.add(flag);

            // Flag base
            const baseGeometry = new THREE.BoxGeometry(0.8, 0.3, 0.8);
            const baseMaterial = new THREE.MeshStandardMaterial({
                color: 0x6b6b6b,
                roughness: 0.6,
                metalness: 0.3
            });
            const base = new THREE.Mesh(baseGeometry, baseMaterial);
            base.position.y = 0.15;
            base.castShadow = true;
            group.add(base);

            return group;
        }

        const flag = createFlag({ x: 50, z: 50 });
        scene.add(flag);

        // ============================================
        // BUILDINGS & OBSTACLES
        // ============================================
        
        function createBuilding(position, size = 1) {
            const group = new THREE.Group();
            group.position.set(position.x, 0, position.z);

            const width = size * 4;
            const height = size * 4;
            const depth = size * 4;

            // Walls
            const wallGeometry = new THREE.BoxGeometry(width, height, 0.3);
            const wallMaterial = new THREE.MeshStandardMaterial({
                color: 0xa0a0a0,
                roughness: 0.7,
                metalness: 0.1
            });

            // 4 walls
            const wall1 = new THREE.Mesh(wallGeometry, wallMaterial);
            wall1.position.set(0, height / 2, depth / 2);
            wall1.castShadow = true;
            group.add(wall1);

            const wall2 = new THREE.Mesh(wallGeometry, wallMaterial);
            wall2.position.set(0, height / 2, -depth / 2);
            wall2.castShadow = true;
            group.add(wall2);

            const wall3 = new THREE.Mesh(wallGeometry, wallMaterial);
            wall3.rotation.y = Math.PI / 2;
            wall3.position.set(width / 2, height / 2, 0);
            wall3.castShadow = true;
            group.add(wall3);

            const wall4 = new THREE.Mesh(wallGeometry, wallMaterial);
            wall4.rotation.y = Math.PI / 2;
            wall4.position.set(-width / 2, height / 2, 0);
            wall4.castShadow = true;
            group.add(wall4);

            // Roof
            const roofGeometry = new THREE.BoxGeometry(width * 0.9, 0.2, depth * 0.9);
            const roofMaterial = new THREE.MeshStandardMaterial({
                color: 0x8b6b4a,
                roughness: 0.5,
                metalness: 0.2
            });
            const roof = new THREE.Mesh(roofGeometry, roofMaterial);
            roof.position.y = height;
            roof.castShadow = true;
            group.add(roof);

            return group;
        }

        function createTree(position) {
            const group = new THREE.Group();
            group.position.set(position.x, 0, position.z);

            // Trunk
            const trunkGeometry = new THREE.CylinderGeometry(0.4, 0.6, 4, 16);
            const trunkMaterial = new THREE.MeshStandardMaterial({
                color: 0x8b6b4a,
                roughness: 0.8,
                metalness: 0.1
            });
            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunk.position.y = 2;
            trunk.castShadow = true;
            group.add(trunk);

            // Leaves (conical)
            const leavesGeometry = new THREE.ConeGeometry(1.5, 4, 32);
            const leavesMaterial = new THREE.MeshStandardMaterial({
                color: 0x2ecc71,
                roughness: 0.9,
                metalness: 0
            });
            const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
            leaves.position.y = 4.5;
            leaves.rotation.y = Math.PI / 4;
            leaves.castShadow = true;
            group.add(leaves);

            return group;
        }

        // Add some buildings
        const building1 = createBuilding({ x: 20, z: 20 }, 1.5);
        scene.add(building1);

        const building2 = createBuilding({ x: 80, z: 20 }, 1);
        scene.add(building2);

        const building3 = createBuilding({ x: 20, z: 80 }, 2);
        scene.add(building3);

        // Add some trees
        const treePositions = [
            { x: 30, z: 30 },
            { x: 70, z: 70 },
            { x: 15, z: 60 },
            { x: 85, z: 15 },
            { x: 50, z: 10 },
            { x: 10, z: 50 },
            { x: 90, z: 50 },
            { x: 50, z: 90 }
        ];

        treePositions.forEach(pos => {
            const tree = createTree(pos);
            scene.add(tree);
        });

        // ============================================
        // ROAD NETWORK
        // ============================================
        
        function createRoad(start, end, width = 4) {
            const group = new THREE.Group();
            
            // Calculate direction and length
            const dx = end.x - start.x;
            const dz = end.z - start.z;
            const length = Math.sqrt(dx * dx + dz * dz);
            const angle = Math.atan2(dz, dx);

            // Road segment
            const roadGeometry = new THREE.BoxGeometry(length, 0.2, width);
            const roadMaterial = new THREE.MeshStandardMaterial({
                color: 0x6b6b6b,
                roughness: 0.9,
                metalness: 0.1
            });
            const road = new THREE.Mesh(roadGeometry, roadMaterial);
            road.position.set(start.x + dx / 2, 0.1, start.z + dz / 2);
            road.rotation.y = angle;
            road.castShadow = false;
            road.receiveShadow = true;
            group.add(road);

            return group;
        }

        // Main roads
        const road1 = createRoad({ x: 0, z: 50 }, { x: 100, z: 50 });
        scene.add(road1);

        const road2 = createRoad({ x: 50, z: 0 }, { x: 50, z: 100 });
        scene.add(road2);

        const road3 = createRoad({ x: 0, z: 0 }, { x: 50, z: 0 });
        scene.add(road3);

        const road4 = createRoad({ x: 50, z: 100 }, { x: 100, z: 100 });
        scene.add(road4);

        // ============================================
        // WATER AREAS
        // ============================================
        
        function createWater(position, size) {
            const geometry = new THREE.PlaneGeometry(size * 4, size * 4);
            const material = new THREE.MeshStandardMaterial({
                color: 0x4a87b8,
                roughness: 0.1,
                metalness: 0.3,
                transparent: true,
                opacity: 0.8
            });
            const water = new THREE.Mesh(geometry, material);
            water.position.set(position.x, -0.1, position.z);
            water.rotation.x = -Math.PI / 2;
            water.receiveShadow = true;
            return water;
        }

        const water1 = createWater({ x: 80, z: 80 }, 8);
        scene.add(water1);

        // ============================================
        // ANIMATION LOOP
        // ============================================
        
        let time = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            
            time += 0.01;
            
            // Simple flag waving animation
            if (flag && flag.children[1]) {
                flag.children[1].rotation.z = Math.sin(time * 2) * 0.1;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Remove loading screen
        document.getElementById('loading').style.display = 'none';

        // Start animation
        animate();
    </script>
</body>
</html>
