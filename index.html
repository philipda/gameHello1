<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tank Game - Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #111; 
            font-family: Arial, sans-serif;
        }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
        }
        #info h1 { font-size: 18px; margin-bottom: 10px; color: #4a87b8; }
        #info p { margin: 5px 0; }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            background: rgba(0,0,0,0.8);
            padding: 30px;
            border-radius: 10px;
        }
        #error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4444;
            font-size: 18px;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>3D Tank Game - Preview</h1>
        <p><strong>Grid:</strong> 50x50 cells, 4m each</p>
        <p><strong>Map Size:</strong> 200m x 200m</p>
        <p><strong>Tanks:</strong> Player 1 (Blue), Player 2 (Brown)</p>
        <p><strong>Target:</strong> Yellow flag at center</p>
        <p><strong>Controls:</strong> Mouse drag to rotate, scroll to zoom</p>
        <p style="margin-top: 10px; font-size: 12px; color: #888;">
            Design preview - No gameplay controls yet
        </p>
    </div>
    <div id="loading">Loading 3D Scene...</div>
    <div id="error"></div>

    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Load Three.js addons -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <!-- Game scripts -->
    <script src="js/controls.js"></script>
    <script src="js/tank.js"></script>
    <script src="js/map.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
